<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="hero">
  <img src="{{ '/assets/img/avatar.jpg' | relative_url }}" alt="{{ site.author }}" class="avatar">
  <h1><a href="{{ '/' | relative_url }}">{{ site.author }}</a></h1>
  <nav class="links">
    <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
    <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://x.com/{{ site.x_username }}" target="_blank" rel="noopener">X</a>
  </nav>
</header>

<main>
{{ content }}
</main>

</body>
</html>
