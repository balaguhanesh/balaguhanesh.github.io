<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% feed_meta %}
</head>
<body>

<header class="hero">
  <img src="{{ '/assets/img/avatar.png' | relative_url }}" alt="{{ site.author }}" class="avatar">
  <h1><a href="{{ '/' | relative_url }}">{{ site.author }}</a></h1>
  <p class="tagline">Engineer — Agentic AI / Voice AI</p>
  <p class="location">Bengaluru, India</p>
  <nav class="links">
    <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
    <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a>
    <a href="mailto:{{ site.email }}">Email</a>
    <a href="{{ site.resume_url }}" target="_blank" rel="noopener">Resume</a>
    <a href="{{ '/blog/' | relative_url }}">Blog</a>
  </nav>
</header>

<main>
{{ content }}
</main>

<footer>
  <p>&copy; 2026 {{ site.author }}</p>
</footer>

</body>
</html>
