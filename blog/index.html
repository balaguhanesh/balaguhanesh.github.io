---
layout: default
title: Blog
permalink: /blog/
---

<section id="blog-list">
  <h2>Blog</h2>
  {% if site.posts.size > 0 %}
    <ul class="post-list">
      {% for post in site.posts %}
        <li>
          <span class="post-date">{{ post.date | date: "%b %-d, %Y" }}</span>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="project-desc">Nothing posted yet — first one's coming.</p>
  {% endif %}
</section>
